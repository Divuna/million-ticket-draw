<!doctype html>
<html lang="cs">
  <head>
    <!-- 🛡️ ONE SIGNAL GUARD MUSÍ BÝT ÚPLNĚ NAHOŘE!!! -->
    <script>
      window.OSAutoStart = false;
      window.OSNotificationAutoPrompt = false;

      (function () {
        window.__ONESIGNAL_ALLOW_INIT = false;
        window.__oneSignalInitState = { called: false, blocked: 0, allowed: 0 };

        const guardInit = (...args) => {
          if (window.__oneSignalInitState.called) {
            window.__oneSignalInitState.blocked++;
            console.warn("⛔ Blocked duplicate OneSignal.init()");
            return Promise.resolve();
          }
          if (!window.__ONESIGNAL_ALLOW_INIT) {
            window.__oneSignalInitState.blocked++;
            console.warn("⛔ Blocked OneSignal auto-init()");
            return Promise.resolve();
          }

          window.__oneSignalInitState.called = true;
          window.__oneSignalInitState.allowed++;
          console.log("✅ Allowed OneSignal.init() manually");

          if (window.OneSignalSDK?.init)
            return window.OneSignalSDK.init(...args);

          return Promise.resolve();
        };

        const proxy = new Proxy([], {
          get(t, p) {
            if (p === "push") {
              return (cmd) => {
                if (Array.isArray(cmd) && cmd[0] === "init")
                  return guardInit(...cmd.slice(1));
                return t.push(cmd);
              };
            }
            if (p === "init") return (...a) => guardInit(...a);
            return t[p];
          },
        });

        window.OneSignal = proxy;

        window.__OneSignalInitOnce = (config) => {
          window.__ONESIGNAL_ALLOW_INIT = true;
          return guardInit(config);
        };

        console.log("🛡️ OneSignal Guard loaded FIRST");
      })();
    </script>

    <!-- ORIGINÁL HEAD DÁLE -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
