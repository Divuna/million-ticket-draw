<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- 🧱 Blokace automatické inicializace OneSignal, kterou Lovable přidává do buildu -->
    <script>
      // Pokud Lovable přidá automatický OneSignal.init(), tento blok ho zastaví
      (function () {
        const originalPush = Array.prototype.push;
        window.OneSignal = window.OneSignal || [];
        window.OneSignal.push = function (f) {
          try {
            if (typeof f === "function" && f.toString().includes("init(")) {
              console.log("🚫 Blocked Lovable auto-init (OneSignal.init)");
              return;
            }
          } catch (e) {
            console.warn("⚠️ OneSignal push intercept warning:", e);
          }
          return originalPush.call(this, f);
        };
      })();
    </script>

    <!-- Define OneSignalDeferred BEFORE loading SDK -->
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
    </script>

    <!-- ✅ Načtení oficiálního SDK (v16) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </head>

  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- ✅ Načtení hlavní aplikace -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
