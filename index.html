<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- ========================================================= -->
    <!-- 🛡️ OCHRANA PROTI DUPLICITNÍ INICIALIZACI ONESIGNAL -->
    <!-- ========================================================= -->
    <script>
      // KROK 1: Oficiální OneSignal příznaky pro vypnutí auto-init
      window.OSNotificationAutoPrompt = false;
      window.OSAutoStart = false;
      window.OneSignalDeferred = window.OneSignalDeferred || [];

      // KROK 2: Proxy pro blokování duplicitních OneSignal.init()
      (function() {
        let initCalled = false;
        let initAttempts = 0;
        let originalInit = null;

        // Dočasný OneSignal array pro queueing
        window.OneSignal = window.OneSignal || [];

        // Wrapper funkce která zachytí init
        const initWrapper = function(...args) {
          initAttempts++;

          console.log(`[OneSignal Guard] Init pokus #${initAttempts}`, {
            initialized: initCalled,
            caller: new Error().stack?.split('\n')[2]?.trim()
          });

          // Blokujeme druhý a další pokusy
          if (initCalled) {
            console.warn(`[OneSignal Guard] ❌ BLOKOVÁNO: Duplicitní init #${initAttempts}`);
            return Promise.resolve();
          }

          // První init povolíme
          initCalled = true;
          console.log('[OneSignal Guard] ✅ První init povolen');

          // Zavoláme původní init
          if (originalInit) {
            return originalInit.apply(this, args);
          }

          // Fallback: přidáme do queue
          window.OneSignal.push(['init', ...args]);
          return Promise.resolve();
        };

        // Čekáme až se OneSignal SDK načte
        const checkInterval = setInterval(() => {
          if (window.OneSignal && typeof window.OneSignal.init === 'function') {
            clearInterval(checkInterval);

            // Uložíme původní init
            originalInit = window.OneSignal.init;

            // Nahradíme init naším wrapperem
            window.OneSignal.init = initWrapper;

            console.log('[OneSignal Guard] 🛡️ Ochrana nainstalována');
          }
        }, 50);

        // Timeout po 10 sekundách
        setTimeout(() => {
          clearInterval(checkInterval);
          if (!originalInit) {
            console.warn('[OneSignal Guard] ⚠️ SDK se nenačetlo do 10s');
          }
        }, 10000);

        console.log('🛑 OneSignal auto-init (SDK v16) disabled + guard active');
      })();
    </script>

    <!-- ========================================================= -->
    <!-- ✔️ LOAD OFFICIAL ONESIGNAL SDK v16 (bez auto-initu) -->
    <!-- ========================================================= -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
