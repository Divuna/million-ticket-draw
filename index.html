<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="facebook-domain-verification" content="gxkf1jmavmy2zhzwmslyan4fc92az" />
    <title>OneMil</title>

    <!-- Consent Mode v2 default (deny everything until user chooses) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      try {
        var stored = localStorage.getItem('cookie_consent');
        var parsed = stored ? JSON.parse(stored) : null;
        var granted = parsed && parsed.analytics ? 'granted' : 'denied';
        var adGranted = parsed && parsed.marketing ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: adGranted,
          ad_user_data: adGranted,
          ad_personalization: adGranted,
          analytics_storage: granted,
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      } catch (e) {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      }
    </script>

    <!-- GTM (and downstream GA4 / Meta Pixel) is NOT loaded here.
         It is injected dynamically from src/lib/consent.ts only after the user
         grants analytics or marketing consent. This keeps the site GDPR-compliant
         (no tracking scripts before consent). -->

    <!-- Initialize the OneSignal deferred queue without blocking SDK init -->
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
    </script>

    <!-- ========================================================= -->
    <!-- OFICIÁLNÍ OneSignal SDK v16 -->
    <!-- ========================================================= -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
