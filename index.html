<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />

    <!--
      Content-Security-Policy (bezpečnostní nález P1).

      Doručuje se přes meta tag, protože produkční web běží na Lovable a ten
      nemá podporovaný způsob, jak nastavit vlastní HTTP hlavičky. `vercel.json`
      v repu se na produkci NEPOUŽÍVÁ (ověřeno: web obsluhuje Cloudflare edge
      Lovable, hlavičky HSTS/Referrer-Policy/X-Content-Type-Options přicházejí
      z této vrstvy, ne z repa).

      Omezení meta varianty (nelze obejít v repu):
      - `frame-ancestors` (P2) a `Cross-Origin-Resource-Policy` (P3) prohlížeč
        v meta tagu IGNORUJE — musí přijít jako HTTP hlavička z edge vrstvy.
      - `'unsafe-inline'` u script-src je nutné kvůli inline bootstrapu GA4,
        Meta Pixelu, OneSignalu a JSON-LD níže v tomto souboru; u style-src
        kvůli inline `style={{…}}` v Reactu. CSP tak neblokuje inline XSS,
        ale blokuje načtení skriptů z cizích domén.

      Při přidání nové externí služby je nutné doplnit její doménu sem, jinak
      ji prohlížeč zablokuje.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://cdn.onesignal.com https://*.onesignal.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' data: https://fonts.gstatic.com;
               img-src 'self' data: blob: https:;
               media-src 'self' data: blob: https:;
               connect-src 'self' https://xkzhjldrojjlrkezorey.supabase.co wss://xkzhjldrojjlrkezorey.supabase.co https://*.supabase.co wss://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://connect.facebook.net https://www.facebook.com https://*.onesignal.com https://onesignal.com;
               frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.onesignal.com;
               worker-src 'self' blob:;
               manifest-src 'self';
               form-action 'self' https://checkout.stripe.com;
               upgrade-insecure-requests"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0F" />
    <meta name="facebook-domain-verification" content="gxkf1jmavmy2zhzwmslyan4fc92az" />
    <title>OneMil — Luxusní soutěže o skutečné výhry</title>
    <meta name="description" content="Soutěžte o auta, dovolené a luxusní elektroniku na OneMil. Získávejte MioCoiny u partnerů a hrajte o exkluzivní věcné ceny." />
    <link rel="canonical" href="https://onemil.cz/" />

    <!-- Open Graph -->
    <meta property="og:title" content="OneMil — Luxusní soutěže o skutečné výhry" />
    <meta property="og:description" content="Soutěžte o auta, dovolené a luxusní elektroniku. Získávejte MioCoiny u partnerů a hrajte o exkluzivní věcné ceny." />
    <meta property="og:url" content="https://onemil.cz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneMil" />
    <meta property="og:locale" content="cs_CZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OneMil — Luxusní soutěže o skutečné výhry" />
    <meta name="twitter:description" content="Soutěžte o auta, dovolené a luxusní elektroniku na OneMil." />

    <!-- JSON-LD: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "OneMil",
            "url": "https://onemil.cz/",
            "description": "Luxusní soutěže. Skutečné výhry.",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "name": "OneMil",
            "url": "https://onemil.cz/",
            "inLanguage": "cs-CZ"
          }
        ]
      }
    </script>

    <!-- Consent Mode v2 default (deny everything until user chooses) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      try {
        var stored = localStorage.getItem('cookie_consent');
        var parsed = stored ? JSON.parse(stored) : null;
        var granted = parsed && parsed.analytics ? 'granted' : 'denied';
        var adGranted = parsed && parsed.marketing ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: adGranted,
          ad_user_data: adGranted,
          ad_personalization: adGranted,
          analytics_storage: granted,
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      } catch (e) {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      }
    </script>

    <!-- GTM is injected dynamically from src/lib/consent.ts after consent.
         GA4 (gtag.js) loads here but respects Consent Mode v2 defaults above
         (analytics_storage / ad_storage = 'denied' until user grants consent).
         Meta Pixel base script is loaded here but fbq('init') and PageView
         are deferred until marketing consent is granted (see consent.ts). -->

    <!-- Google Analytics GA4 (Consent Mode v2 gated) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REZ7MGTEKK"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-REZ7MGTEKK', { anonymize_ip: true });
    </script>

    <!-- Meta Pixel base code (init + PageView deferred until marketing consent) -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    </script>
    <!-- Initialize the OneSignal deferred queue without blocking SDK init -->
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
    </script>

    <!-- ========================================================= -->
    <!-- OFICIÁLNÍ OneSignal SDK v16 -->
    <!-- ========================================================= -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
