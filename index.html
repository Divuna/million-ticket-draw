<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        if (window.OneSignalInitialized) return;
        window.OneSignalInitialized = true;

        console.log("🚀 Inicializace OneSignal SDK...");

        try {
          await OneSignal.init({
            appId: "5e5539e1-fc71-4c4d-9fef-414293d83dbb",
            allowLocalhostAsSecureOrigin: true,
            notifyButton: { enable: false },
            slidedown: { enabled: false }
          });

          console.log("✅ OneSignal SDK úspěšně inicializován");
          console.log("📊 Stav subscription:", OneSignal.User.PushSubscription.optedIn);
        } catch (e) {
          console.error("💥 Chyba při inicializaci OneSignal:", e);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
