    <!-- Consent Mode v2 default (deny everything until user chooses) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      try {
        var stored = localStorage.getItem('cookie_consent');
        var parsed = stored ? JSON.parse(stored) : null;
        var granted = parsed && parsed.analytics ? 'granted' : 'denied';
        var adGranted = parsed && parsed.marketing ? 'granted' : 'denied';
        gtag('consent', 'default', {
          ad_storage: adGranted,
          ad_user_data: adGranted,
          ad_personalization: adGranted,
          analytics_storage: granted,
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      } catch (e) {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted'
        });
      }
    </script>

    <!-- GTM is injected dynamically from src/lib/consent.ts after consent.
         GA4 (gtag.js) loads here but respects Consent Mode v2 defaults above
         (analytics_storage / ad_storage = 'denied' until user grants consent).
         Meta Pixel base script is loaded here but fbq('init') and PageView
         are deferred until marketing consent is granted (see consent.ts). -->

    <!-- Google Analytics GA4 (Consent Mode v2 gated) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REZ7MGTEKK"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-REZ7MGTEKK', { anonymize_ip: true });
    </script>

    <!-- Meta Pixel base code (init + PageView deferred until marketing consent) -->
    <script>
      !function(f,b,e,v,n,t,s)

      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    </script>
    <!-- Meta Pixel <noscript> fallback is placed in <body> (HTML5 disallows it in <head>). -->

    <!-- Initialize the OneSignal deferred queue without blocking SDK init -->
    <script>
