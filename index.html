<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- ================================================================== -->
    <!-- 🚫 ABSOLUTNÍ ZÁKAZ JAKÉKOLIV OneSignal INIT (anti-Lovable, anti-SDK) -->
    <!-- ================================================================== -->
    <script>
      (function () {
        "use strict";

        // Blokujeme úplně vše
        window.OneSignal = [];
        window.OSAutoStart = false;
        window.OSNotificationAutoPrompt = false;

        // Žádné push() nesmí obsahovat init
        const block = function (cmd) {
          if (Array.isArray(cmd) && cmd[0] === "init") {
            console.warn("🚫 BLOCKED: OneSignal.init() prevented completely");
            return;
          }
          return window.OneSignalQueue.push(cmd);
        };

        window.OneSignalQueue = [];
        window.OneSignal.push = block;

        // Zablokujeme veškerý přístup k OneSignal.init
        Object.defineProperty(window.OneSignal, "init", {
          get() {
            return function () {
              console.warn("🚫 BLOCKED: init() intercepted");
            };
          },
          set() {
            console.warn("🚫 BLOCKED: attempt to override init()");
          },
        });

        // Definujeme ruční povolení pouze pokud to spustíš ty
        window.__OneSignalInitOnce = (config) => {
          console.log("🔓 Manual OneSignal init allowed");
          return window.OneSignalSDK?.init?.(config);
        };

        console.log("🛡️ HARD BLOCK MODE ACTIVE – OneSignal init is fully locked.");
      })();
    </script>

    <!-- ======================== -->
    <!-- OFICIÁLNÍ SDK OneSignal -->
    <!-- ======================== -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
