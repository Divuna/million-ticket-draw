<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- ========================================================= -->
    <!-- 🛡️ KRITICKÁ OCHRANA - MUSÍ BÝT PRVNÍ! -->
    <!-- ========================================================= -->
    <script>
      // Tohle se spustí OKAMŽITĚ před čímkoliv jiným
      (function() {
        'use strict';

        // Globální stav inicializace
        window.__oneSignalInitState = {
          called: false,
          blocked: 0,
          allowed: 0
        };

        // Oficiální OneSignal příznaky
        window.OSNotificationAutoPrompt = false;
        window.OSAutoStart = false;

        // Vytvoříme prázdný OneSignal array s custom push metodou
        const queue = [];

        const customPush = function(item) {
          // Zachytíme init volání z Lovable runtime
          if (Array.isArray(item) && item[0] === 'init') {
            const state = window.__oneSignalInitState;

            if (state.called) {
              state.blocked++;
              console.warn(
                `[OneSignal Guard] ❌ BLOKOVÁNO init #${state.blocked + state.allowed}`,
                '\nZdroj:', new Error().stack.split('\n')[2]
              );
              return queue.length;
            }

            state.called = true;
            state.allowed++;
            console.log(`[OneSignal Guard] ✅ První init povolen (#${state.allowed})`);
          }

          return queue.push(item);
        };

        // Vytvoříme Proxy pro OneSignal
        window.OneSignal = new Proxy(queue, {
          get(target, prop) {
            if (prop === 'push') {
              return customPush;
            }

            if (prop === 'init') {
              return function(...args) {
                const state = window.__oneSignalInitState;

                if (state.called) {
                  state.blocked++;
                  console.warn(
                    `[OneSignal Guard] ❌ BLOKOVÁNO init() #${state.blocked + state.allowed}`,
                    '\nZdroj:', new Error().stack.split('\n')[2]
                  );
                  return Promise.resolve();
                }

                state.called = true;
                state.allowed++;
                console.log(`[OneSignal Guard] ✅ První init() povolen (#${state.allowed})`);

                if (window.OneSignalSDK?.init) {
                  return window.OneSignalSDK.init(...args);
                }

                customPush(['init', ...args]);
                return Promise.resolve();
              };
            }

            return target[prop];
          },

          set(target, prop, value) {
            target[prop] = value;
            return true;
          }
        });

        window.OneSignalDeferred = window.OneSignalDeferred || [];

        console.log('🛡️ OneSignal Guard AKTIVNÍ (blocking duplicates)');
      })();
    </script>

    <!-- ========================================================= -->
    <!-- ✔️ LOAD OFFICIAL ONESIGNAL SDK v16 -->
    <!-- ========================================================= -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
