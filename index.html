<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneMil</title>

    <!-- ========================================================= -->
    <!-- 🔥 BLOKACE AUTO-INIT PRO ONE SIGNAL SDK v16 -->
    <!-- ========================================================= -->
    <!-- DŮLEŽITÉ: SDK v16 používá nový auto-init systém, který se musí vypnout -->
    <script>
      // Vypne automatickou inicializaci OneSignal SDK
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignal = window.OneSignal || [];

      console.log("🛑 OneSignal auto-init disabled (custom init used)");
    </script>

    <!-- ========================================================= -->
    <!-- 🔥 NAČTENÍ OFICIÁLNÍHO ONESIGNAL SDK (v16) – BEZ AUTO-INIT -->
    <!-- ========================================================= -->
    <script
      src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
      defer
      data-onesignal-no-auto-init="true"
    ></script>
  </head>

  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- 🧠 Načtení celé aplikace -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
