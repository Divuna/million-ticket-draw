    <!-- 🛡️ ULTIMATE OneSignal GUARD v3 (blokuje Lovable auto-init) -->
    <!-- ========================================================= -->
    <script>
      (function () {
        'use strict';

        // *** NASTAVENÍ ***
        window.__ONESIGNAL_DISABLE_AUTO_INIT = true;
        window.__ONESIGNAL_ALLOW_NEXT_INIT = false;

        // Globální stav
        window.__oneSignalInitState = {
          called: false,
          blocked: 0,
          allowed: 0,
        };

        const state = window.__oneSignalInitState;
        let sdk = undefined;
        let deferredInitArgs = null;

        // Zakázat default auto-prompt a auto-init
        window.OSNotificationAutoPrompt = false;
        window.OSAutoStart = false;

        // Fronta pro případné příkazy
        const queue = [];

        const block = (why) => {
          state.blocked++;
          console.warn(`⛔ [OneSignalGuard] Blokováno init (${why}) #${state.blocked}`);
          return Promise.resolve();
        };

        const safeInit = (...args) => {
          if (state.called) return block("Duplicate volání");
          if (window.__ONESIGNAL_DISABLE_AUTO_INIT && !window.__ONESIGNAL_ALLOW_NEXT_INIT)
            return block("Auto-init zakázán");

          state.called = true;
          state.allowed++;
          window.__ONESIGNAL_ALLOW_NEXT_INIT = false;

          console.log("🟩 [OneSignalGuard] POVOLENO init", args);

          if (sdk && typeof sdk.init === "function") {
            try {
              return sdk.init(...args);
            } catch (e) {
              console.error("❌ Chyba initu SDK:", e);
              return Promise.resolve();
            }
          }

          deferredInitArgs = args;
          console.log("⏳ SDK ještě není načteno – init odložen");
          return Promise.resolve();
        };

        // Proxy pro window.OneSignal
        const proxy = new Proxy([], {
          get(target, prop) {
            if (prop === "push") {
              return function (cmd) {
                if (Array.isArray(cmd) && cmd[0] === "init") {
                  return safeInit(...cmd.slice(1));
                }
                return queue.push(cmd);
              };
            }
            if (prop === "init") {
              return (...args) => safeInit(...args);
            }
            return target[prop];
          },
        });

        // Hard override window.OneSignal
        try {
          Object.defineProperty(window, "OneSignal", {
            configurable: false,
            enumerable: true,
            get() {
              return proxy;
            },
            set(val) {
              console.warn("[OneSignalGuard] Ignoring attempt to overwrite OneSignal");
              if (Array.isArray(val)) {
                val.forEach((cmd) => queue.push(cmd));
              }
            },
          });
        } catch {
          window.OneSignal = proxy;
        }

        // Hard override SDK loader
        Object.defineProperty(window, "OneSignalSDK", {
          configurable: true,
          enumerable: true,
          get() {
            return sdk;
          },
          set(value) {
            sdk = value;
            if (sdk && typeof sdk.init === "function") {
              const original = sdk.init.bind(sdk);
              sdk.init = (...args) => safeInit(...args);

              if (state.called && deferredInitArgs) {
                const argsToRun = deferredInitArgs;
                deferredInitArgs = null;
                console.log("▶️ Spouštím uložený init (SDK je nyní ready)");
                try {
                  original(...argsToRun);
                } catch (e) {
                  console.error("❌ Chyba odloženého initu", e);
                }
              }
            }
          },
        });

        // Veřejná safe metoda pro ruční inicializaci
        window.__OneSignalInitOnce = (config) => {
          window.__ONESIGNAL_ALLOW_NEXT_INIT = true;
          return safeInit(config);
        };

        console.log("🛡️ OneSignal GUARD v3 aktivní (blokuje Lovable auto-init)");
      })();
    </script>

      data-onesignal-no-auto-init="true"
