name: Playwright Staging Full E2E

on:
  workflow_dispatch:
  schedule:
    # Prague time (CEST = UTC+2): 04:00, 12:00, 20:00 — offset from prod smoke (00:00, 08:00, 16:00)
    - cron: '0 2 * * *'    # 04:00 Praha
    - cron: '0 10 * * *'   # 12:00 Praha
    - cron: '0 18 * * *'   # 20:00 Praha

jobs:
  e2e:
    name: Full E2E (Chromium) — Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Seed win contest
        id: seed-win-contest
        run: |
          RESPONSE=$(curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/contests" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{
              "title": "E2E staging win contest auto",
              "description": "Automatic staging win-flow contest for E2E.",
              "main_prize": "Staging main prize",
              "ticket_count": 100,
              "ticket_price": 10,
              "status": "active",
              "next_ticket_number": 100,
              "fast_game": false,
              "created_at": "2020-01-01T00:00:00Z"
            }')
          echo "PostgREST response: $RESPONSE"
          WIN_ID=$(echo "$RESPONSE" | jq -r 'if type == "array" then .[0].id else null end' 2>/dev/null || echo "null")
          if [ -z "$WIN_ID" ] || [ "$WIN_ID" = "null" ]; then
            echo "ERROR: seed failed — see PostgREST response above" >&2
            exit 1
          fi
          echo "win_contest_id=$WIN_ID" >> $GITHUB_OUTPUT
          echo "Seeded win contest: $WIN_ID"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reset test user wallet
        run: |
          curl -s -X PATCH \
            "${SUPABASE_URL}/rest/v1/wallets?user_id=eq.7822a82e-f1d3-45ee-827b-679640ce6b65" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"balance_coins": 5000, "bonus_balance_coins": 0}'
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reset test user vouchers
        # Delete all user_vouchers rows for the E2E test user so that seeded
        # vouchers appear as "available" again on /vouchers (the UI filters out
        # vouchers already in the user's collection via useUserVouchers).
        run: |
          curl -s -X DELETE \
            "${SUPABASE_URL}/rest/v1/user_vouchers?user_id=eq.7822a82e-f1d3-45ee-827b-679640ce6b65" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Prefer: return=minimal"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seed E2E Spec03 voucher
        # Seed a fresh voucher for spec 03 with default created_at (now) so it
        # appears FIRST in the Dostupné list (sorted created_at DESC). Spec 03
        # uses .first() and always picks this newest entry — never spec 10's card.
        run: |
          RESPONSE=$(curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/vouchers" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{
              "name": "E2E Spec03 Voucher",
              "is_public": true,
              "max_quantity": null,
              "redeemed_count": 0,
              "start_date": null,
              "end_date": null,
              "image_url": "https://placehold.co/200x200/1D2128/E7EBF0?text=E2E03",
              "banner_url": "https://placehold.co/400x200/1D2128/E7EBF0?text=E2E+Spec03"
            }')
          echo "Seed spec03 voucher response: $RESPONSE"
          VOUCHER_ID=$(echo "$RESPONSE" | jq -r 'if type == "array" then .[0].id else null end' 2>/dev/null || echo "null")
          if [ -z "$VOUCHER_ID" ] || [ "$VOUCHER_ID" = "null" ]; then
            echo "WARNING: spec03 voucher seed failed. Response: $RESPONSE" >&2
          else
            echo "Seeded E2E Spec03 voucher: $VOUCHER_ID"
          fi
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seed E2E Spec10 voucher
        # Seed a dedicated voucher for spec 10 with a past created_at so it
        # appears LAST in the Dostupné list. Spec 03 uses .first() and always
        # picks the newest entry (E2E Spec03 Voucher seeded above). Spec 10
        # finds this card by name via scoped locator — never conflicts with spec 03.
        # max_quantity: null = unlimited (can be bought again after user_vouchers reset).
        run: |
          RESPONSE=$(curl -s -X POST \
            "${SUPABASE_URL}/rest/v1/vouchers" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{
              "name": "E2E Spec10 Voucher",
              "is_public": true,
              "max_quantity": null,
              "redeemed_count": 0,
              "start_date": null,
              "end_date": null,
              "created_at": "2020-01-01T00:00:00Z",
              "image_url": "https://placehold.co/200x200/1D2128/E7EBF0?text=E2E10",
              "banner_url": "https://placehold.co/400x200/1D2128/E7EBF0?text=E2E+Spec10"
            }')
          echo "Seed spec10 voucher response: $RESPONSE"
          VOUCHER_ID=$(echo "$RESPONSE" | jq -r 'if type == "array" then .[0].id else null end' 2>/dev/null || echo "null")
          if [ -z "$VOUCHER_ID" ] || [ "$VOUCHER_ID" = "null" ]; then
            echo "WARNING: spec10 voucher seed failed — spec 10 may fail. Response: $RESPONSE" >&2
          else
            echo "Seeded E2E Spec10 voucher: $VOUCHER_ID"
          fi
        env:
          SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run full E2E suite
        id: e2e_tests
        run: npm run test:smoke
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_INTERNAL_FUNCTION_TOKEN: ${{ secrets.STAGING_VITE_INTERNAL_FUNCTION_TOKEN }}
          E2E_TEST_EMAIL: ${{ secrets.STAGING_E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.STAGING_E2E_TEST_PASSWORD }}
          E2E_CONTEST_ID: ${{ secrets.STAGING_E2E_CONTEST_ID }}
          E2E_WIN_CONTEST_ID: ${{ steps.seed-win-contest.outputs.win_contest_id }}

      - name: E2E status — OK
        if: success()
        run: |
          echo "## ✅ OneMil STAGING full E2E OK" >> $GITHUB_STEP_SUMMARY
          echo "All specs passed against staging." >> $GITHUB_STEP_SUMMARY

      - name: Telegram — OK
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"✅ OneMil STAGING full E2E OK — all specs passed"}'

      - name: E2E status — FAILED
        if: failure()
        run: |
          echo "## ❌ OneMil STAGING full E2E FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check the HTML report artifact and screenshots above." >> $GITHUB_STEP_SUMMARY

      - name: Telegram — FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"❌ OneMil STAGING full E2E FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-screenshots-${{ github.run_id }}
          path: test-results/
          retention-days: 7
