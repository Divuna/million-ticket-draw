name: Playwright Staging Full E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Full E2E (Chromium) — Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run full E2E suite
        id: e2e_tests
        run: npm run test:smoke
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_INTERNAL_FUNCTION_TOKEN: ${{ secrets.STAGING_VITE_INTERNAL_FUNCTION_TOKEN }}
          E2E_TEST_EMAIL: ${{ secrets.STAGING_E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.STAGING_E2E_TEST_PASSWORD }}
          E2E_CONTEST_ID: ${{ secrets.STAGING_E2E_CONTEST_ID }}
          E2E_WIN_CONTEST_ID: ${{ secrets.STAGING_E2E_WIN_CONTEST_ID }}

      - name: E2E status — OK
        if: success()
        run: |
          echo "## ✅ OneMil STAGING full E2E OK" >> $GITHUB_STEP_SUMMARY
          echo "All specs passed against staging." >> $GITHUB_STEP_SUMMARY

      - name: Telegram — OK
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"✅ OneMil STAGING full E2E OK — all specs passed"}'

      - name: E2E status — FAILED
        if: failure()
        run: |
          echo "## ❌ OneMil STAGING full E2E FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check the HTML report artifact and screenshots above." >> $GITHUB_STEP_SUMMARY

      - name: Telegram — FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"❌ OneMil STAGING full E2E FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-screenshots-${{ github.run_id }}
          path: test-results/
          retention-days: 7
