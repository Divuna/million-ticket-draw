name: Guaranteed purchase benefit database

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/guaranteed-purchase-benefit-db.yml"
      - "supabase/migrations/20260724140039_guaranteed_purchase_benefit_phase1.sql"
      - "supabase/migrations/20260724155213_restrict_guaranteed_benefit_voucher_visibility.sql"
      - "supabase/migrations/20260724162000_expand_voucher_superadmin_visibility.sql"
      - "supabase/migrations/20260724170000_guaranteed_benefit_purchase_phase2_flow.sql"
      - "supabase/migrations/20260725090000_guaranteed_benefit_offer_read_rpc.sql"
      - "supabase/migrations/20260727120000_mystery_coupon_purchase_model.sql"
      - "supabase/migrations/20260727170000_user_contest_favorites_own_row_rls.sql"
      - "supabase/migrations/20260728113000_hide_public_contest_ticket_state.sql"
      - "supabase/migrations/20260728153516_restrict_internal_contest_position_rpcs.sql"
      - "supabase/migrations/20260728164924_fix_public_purchase_wrapper_identity.sql"
      - "supabase/migrations/20260728191209_sanitize_public_winner_notes_and_fix_purchase_edge.sql"
      - "supabase/migrations/20260728204440_harden_public_winner_note_sanitization.sql"
      - "supabase/migrations/20260729065526_close_remaining_public_ticket_inference_paths.sql"
      - "supabase/migrations/20260729083000_fail_closed_public_sequence_text.sql"
      - "supabase/tests/guaranteed_purchase_benefit_phase1.sql"
      - "supabase/tests/guaranteed_benefit_voucher_rls.sql"
      - "supabase/tests/guaranteed_benefit_purchase_phase2.sql"
      - "supabase/tests/user_contest_favorites_rls.sql"
      - "supabase/tests/public_contest_ticket_state_privacy.sql"
      - "supabase/tests/winner_notes_and_edge_purchase_privacy.sql"
      - "supabase/functions/purchase-ticket/index.ts"
      - "supabase/functions/upload-ticket-share/index.ts"
      - "supabase/functions/generate-ticket-image/index.ts"
      - "tests/edge/purchase-ticket.integration.mjs"
      - "tests/edge/share-upload-tombstones.integration.mjs"
      - "supabase/tests/fixtures/guaranteed_purchase_benefit_phase1_baseline.sql"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase1:
    name: Phase 1 and Phase 2 migration and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.4

      - name: Prepare isolated pre-Phase-1 migration chain
        run: |
          mv supabase/migrations supabase/project-migrations
          mkdir supabase/migrations
          cp supabase/tests/fixtures/guaranteed_purchase_benefit_phase1_baseline.sql \
            supabase/migrations/20260724140038_phase1_test_baseline.sql
          cp supabase/project-migrations/20260724140039_guaranteed_purchase_benefit_phase1.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260724155213_restrict_guaranteed_benefit_voucher_visibility.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260724162000_expand_voucher_superadmin_visibility.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260724170000_guaranteed_benefit_purchase_phase2_flow.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260725090000_guaranteed_benefit_offer_read_rpc.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260727120000_mystery_coupon_purchase_model.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260727170000_user_contest_favorites_own_row_rls.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260728113000_hide_public_contest_ticket_state.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260728153516_restrict_internal_contest_position_rpcs.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260728164924_fix_public_purchase_wrapper_identity.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260728191209_sanitize_public_winner_notes_and_fix_purchase_edge.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260728204440_harden_public_winner_note_sanitization.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260729065526_close_remaining_public_ticket_inference_paths.sql \
            supabase/migrations/
          cp supabase/project-migrations/20260729083000_fail_closed_public_sequence_text.sql \
            supabase/migrations/
          # Řetězec musí zůstat úplný a ve správném pořadí — pgTAP jinak testuje
          # neúplné schéma (chybějící get_guaranteed_benefit_offer shodí plán).
          ls supabase/migrations/

      - name: First clean migration pass
        run: supabase start

      - name: First full pgTAP pass
        run: |
          supabase test db supabase/tests/guaranteed_purchase_benefit_phase1.sql --local
          supabase test db supabase/tests/guaranteed_benefit_voucher_rls.sql --local
          supabase test db supabase/tests/guaranteed_benefit_purchase_phase2.sql --local
          supabase test db supabase/tests/user_contest_favorites_rls.sql --local
          supabase test db supabase/tests/public_contest_ticket_state_privacy.sql --local
          supabase test db supabase/tests/winner_notes_and_edge_purchase_privacy.sql --local

      - name: purchase-ticket Edge Function integration
        run: |
          supabase status -o env > /tmp/supabase-local.env
          set -a
          source /tmp/supabase-local.env
          set +a
          supabase functions serve purchase-ticket --no-verify-jwt \
            > /tmp/purchase-ticket-function.log 2>&1 &
          function_pid=$!
          trap 'kill "$function_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --request OPTIONS \
              "$API_URL/functions/v1/purchase-ticket" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/purchase-ticket-function.log
              exit 1
            fi
            sleep 1
          done
          node tests/edge/purchase-ticket.integration.mjs

      - name: deprecated share upload Edge Functions reject writes
        run: |
          supabase status -o env > /tmp/supabase-local.env
          set -a
          source /tmp/supabase-local.env
          set +a
          supabase functions serve --no-verify-jwt \
            > /tmp/share-upload-tombstones.log 2>&1 &
          function_pid=$!
          trap 'kill "$function_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --request OPTIONS \
              "$API_URL/functions/v1/upload-ticket-share" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/share-upload-tombstones.log
              exit 1
            fi
            sleep 1
          done
          node tests/edge/share-upload-tombstones.integration.mjs

      - name: Re-run migration command on the same database
        run: supabase migration up --local

      - name: pgTAP after same-database no-op migration run
        run: |
          supabase test db supabase/tests/guaranteed_purchase_benefit_phase1.sql --local
          supabase test db supabase/tests/guaranteed_benefit_voucher_rls.sql --local
          supabase test db supabase/tests/guaranteed_benefit_purchase_phase2.sql --local
          supabase test db supabase/tests/user_contest_favorites_rls.sql --local
          supabase test db supabase/tests/public_contest_ticket_state_privacy.sql --local
          supabase test db supabase/tests/winner_notes_and_edge_purchase_privacy.sql --local

      - name: Second clean migration pass
        run: supabase db reset --local --no-seed

      - name: Second full pgTAP pass
        run: |
          supabase test db supabase/tests/guaranteed_purchase_benefit_phase1.sql --local
          supabase test db supabase/tests/guaranteed_benefit_voucher_rls.sql --local
          supabase test db supabase/tests/guaranteed_benefit_purchase_phase2.sql --local
          supabase test db supabase/tests/user_contest_favorites_rls.sql --local
          supabase test db supabase/tests/public_contest_ticket_state_privacy.sql --local
          supabase test db supabase/tests/winner_notes_and_edge_purchase_privacy.sql --local
