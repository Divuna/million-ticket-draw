name: Temporary Shoptet Grace Verification

on:
  push:
    branches:
      - fix/shoptet-reward-15min-grace

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Relevant source-level Playwright specs
        run: npx playwright test tests/e2e/125-partner-reward-engine-invariant.spec.ts tests/e2e/135-shoptet-delta-import.spec.ts tests/e2e/139-selected-products-no-eligible-reward.spec.ts tests/e2e/158-shoptet-reward-15min-grace.spec.ts
      - name: Production build
        run: npm run build
