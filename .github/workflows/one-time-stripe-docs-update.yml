name: One-time Stripe documentation update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-stripe-docs-update.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update OneMil Stripe documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          STATE_MARKER = "## STRIPE REFUNDACE — PRODUKČNĚ NASAZENO A SANDBOX OTESTOVÁNO (04. 08. 2026)"
          HISTORY_MARKER = "# 04. 08. 2026 — Stripe refundace produkčně nasazeny a Sandbox tok ověřen"
          CLAUDE_MARKER = "# Stripe refundace — produkční invarianty a ověřené Sandbox testy (04. 08. 2026)"

          state_section = r'''## STRIPE REFUNDACE — PRODUKČNĚ NASAZENO A SANDBOX OTESTOVÁNO (04. 08. 2026)

- **PR #309** je v `main` pod merge commitem `e0f7514d`.
- Produkční migrace `20260803090000_harden_stripe_refund_flow.sql` je v Supabase evidována jako **`20260803201005` / `harden_stripe_refund_flow`**.
- Oprava reverze doporučovací odměny je v produkci jako **`20260803192609` / `fix_referral_reversal_ambiguous_call`**.
- `stripe-refund` běží na produkci ve verzi **v137**, `verify_jwt = true`; refundaci smí spustit role **`admin` i `superadmin`**. Změna role je v commitu `ffc0aac8`.
- `stripe-webhook` běží na produkci ve verzi **v338**, `verify_jwt = false`; požaduje platný Stripe podpis.
- Frontend administrace byl publikován přes Lovable a zná stavy čekající, úspěšné i selhané refundace.
- Stripe **Sandbox** endpoint mířící na hlavní Supabase `stripe-webhook` poslouchá přesně: `checkout.session.completed`, `refund.created`, `refund.updated`, `refund.failed`.
- Stripe **live** endpoint zatím podle posledního ověření poslouchá pouze `checkout.session.completed`. Před ostrým spuštěním je nutné přidat stejné tři refundní události také v live režimu; nevytvářet nový endpoint a neměnit signing secret.

**Produkčně ověřené Sandbox testy:**
1. Balíček **50 Kč → 50 MioCoinů**: vznikl právě jeden `payment_credit` +50; refundace skončila `payments.status = refunded`, `stripe_refund_status = succeeded` a vznikl právě jeden `refund_debit` −50.
2. Balíček **300 Kč → 310 MioCoinů**: vznikl právě jeden `payment_credit` +310; refundace odečetla právě jeden `refund_debit` **−310**, tedy i celý balíčkový bonus. Žádný `refund_reversal` ani duplicita.
3. Ochrana po útratě: testovací účet `kutil@opravo.cz` byl se schválením Pavla srovnán z 1 427 MC na 0 jedním odpovídajícím účetním zápisem. Po nové platbě 50 Kč a útratě 5 MC zůstal zůstatek 45 MC; refundace byla odmítnuta **před Stripe** přesnou hláškou o již použitých MioCoinech. Platba zůstala `completed`, `stripe_refund_id`/`stripe_refund_status` zůstaly NULL a nevznikl `refund_debit` ani `refund_reversal`.

**Potvrzené pravidlo:** refundace se smí zahájit pouze tehdy, když má zákazník v běžné peněžence celý počet MioCoinů uložený v `payments.amount`. Tato částka už obsahuje případný bonus balíčku. Všechna současná data a provedené platby jsou testovací a před ostrým provozem budou vymazány.
'''

          history_section = r'''# 04. 08. 2026 — Stripe refundace produkčně nasazeny a Sandbox tok ověřen

- Lovable frontend publikován; administrace zobrazuje nové refundní stavy a ruční kontrolu.
- Sandbox Stripe webhook pro hlavní Supabase endpoint rozšířen z 1 na 4 události: `checkout.session.completed`, `refund.created`, `refund.updated`, `refund.failed`. Live endpoint zůstává zatím pouze na `checkout.session.completed`.
- První pokus o refundaci odhalil, že `stripe-refund` povoloval jen přesnou roli `admin`, zatímco Pavel má `superadmin`. Opraven jediný kontrolní bod v commitu `ffc0aac8`; produkční Edge Function nasazena jako **v137**, `verify_jwt = true`, povoluje `admin` i `superadmin`.
- Sandbox 50 Kč: správně připsáno 50 MC a refundováno jedním odečtem −50; Stripe `succeeded`, platba `refunded`.
- Sandbox 300 Kč: správně připsáno 310 MC a refundováno jedním odečtem −310 včetně bonusu; bez duplicity.
- Ochranný test: `kutil@opravo.cz` se schválením Pavla srovnán z 1 427 MC na 0 s účetním zápisem; po platbě 50 Kč a útratě 5 MC refundace správně odmítnuta před Stripe, platba zůstala `completed`, žádný refundní ledger nevznikl.
- Produkční migrace refundací zůstává `20260803201005`; `stripe-webhook` v338; `stripe-refund` v137. Všechny testy byly v Sandboxu a bez skutečných peněz.
'''

          claude_section = r'''# Stripe refundace — produkční invarianty a ověřené Sandbox testy (04. 08. 2026)

- Produkční DB vrstva: `20260803201005 / harden_stripe_refund_flow`; oprava referral reverze: `20260803192609 / fix_referral_reversal_ambiguous_call`.
- Produkční Edge Functions: `stripe-refund` **v137** (`verify_jwt = true`, role `admin` nebo `superadmin`) a `stripe-webhook` **v338** (`verify_jwt = false`, povinný Stripe podpis).
- Frontend administrace je publikovaný přes Lovable.
- Refundace musí vždy nejdřív volat `prepare_stripe_refund`; Stripe se nesmí volat, pokud běžný zůstatek uživatele nemá celý `payments.amount`.
- `payments.amount` je počet připsaných MioCoinů včetně balíčkového bonusu: 300 Kč = 310 MC, takže úspěšná refundace odečítá všech 310 MC.
- `succeeded` → `refunded`; `pending`/`requires_action` → `refund_pending`; `failed`/`canceled` → návrat MioCoinů i referral reward právě jednou a platba zpět `completed` s terminálním `stripe_refund_status`.
- Sandbox testy jsou produkčně ověřené: 50→50 a refund −50; 300→310 a refund −310; po útratě 5 z 50 byla refundace odmítnuta před Stripe a nevznikl žádný refundní ledger.
- Sandbox webhook hlavního Supabase endpointu poslouchá `checkout.session.completed`, `refund.created`, `refund.updated`, `refund.failed`.
- Live Stripe endpoint podle posledního ověření zatím poslouchá jen `checkout.session.completed`. Před ostrým provozem přidat stejné tři `refund.*` události do **existujícího** live endpointu; nevytvářet nový endpoint a neměnit signing secret.
- Připojený Stripe konektor je považován za live, dokud se neprokáže Test mode. Přes konektor nespouštět refundaci ani jinou Stripe změnu bez výslovného schválení Pavla.
- Změny peněženek, plateb, refundací, referral odměn nebo produkčních migrací vždy vyžadují výslovné schválení Pavla. Testovací ruční srovnání zůstatku musí mít odpovídající `wallet_transactions` záznam.
'''

          def prepend_after_title(path: Path, marker: str, section: str) -> None:
              text = path.read_text(encoding='utf-8-sig')
              if marker in text:
                  return
              first_nl = text.find('\n')
              if first_nl == -1:
                  new_text = text + '\n\n' + section + '\n'
              else:
                  new_text = text[:first_nl + 1] + '\n' + section + '\n' + text[first_nl + 1:]
              path.write_text(new_text, encoding='utf-8')

          def prepend(path: Path, marker: str, section: str) -> None:
              text = path.read_text(encoding='utf-8-sig')
              if marker in text:
                  return
              path.write_text(section + '\n' + text, encoding='utf-8')

          state = Path('onemil_state.md')
          history = Path('onemil_history.md')
          claude = Path('CLAUDE.md')

          prepend_after_title(state, STATE_MARKER, state_section)
          prepend(history, HISTORY_MARKER, history_section)
          prepend(claude, CLAUDE_MARKER, claude_section)

          # Oprava nejdůležitějších zastaralých tvrzení ve starší sekci stavu.
          state_text = state.read_text(encoding='utf-8')
          state_text = state_text.replace(
              '- `stripe-refund` **v135 → v136**, `verify_jwt = true` zachováno,',
              '- `stripe-refund` **v135 → v136 → v137**, `verify_jwt = true`; v137 povoluje role `admin` i `superadmin`,'
          )
          state_text = state_text.replace(
              '**Zbývající kroky (vědomě NEPROVEDENY, každý vyžaduje samostatné schválení):**\n1. **Lovable Publish frontendu** (`AdminPayments.tsx`) — administrace zatím nezobrazí „Refundace čeká" / „Refundace selhala" ani tlačítko „Ověřit stav refundace"; starý build volá stejný endpoint a chybové hlášky zobrazí, ale nové stavy nepozná.\n2. **Rozšíření Stripe webhook endpointu** o `refund.created` / `refund.updated` / `refund.failed` (dnes jen `checkout.session.completed`). Do té doby Stripe refundní události neposílá, takže refundace se `pending`/`requires_action` zůstane v `refund_pending`, dokud ji administrátor ručně neověří.',
              '**Aktuální stav nasazení:** Lovable frontend je publikovaný. Sandbox Stripe endpoint poslouchá všechny 4 potřebné události. Live Stripe endpoint zatím podle posledního ověření poslouchá pouze `checkout.session.completed`; před ostrým provozem je nutné do stejného existujícího live endpointu doplnit `refund.created`, `refund.updated` a `refund.failed`.',
          )
          state_text = state_text.replace(
              '**Potvrzený současný (rozbitý) tok — read-only ověřeno na produkci:**',
              '**Historický rozbitý tok před PR #309 — již neplatí:**',
          )
          state_text = state_text.replace('**Co Draft PR mění:**', '**Co PR #309 změnil:**')
          state.write_text(state_text, encoding='utf-8')
          PY

          rm -f .github/workflows/one-time-stripe-docs-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onemil_state.md onemil_history.md CLAUDE.md .github/workflows/one-time-stripe-docs-update.yml
          git commit -m "docs: record verified Stripe refund production tests"
          git push
