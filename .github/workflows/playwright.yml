name: Playwright Smoke Tests

on:
  push:
    branches: [main, master, claude/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Prague time (CEST = UTC+2): 00:00, 08:00, 16:00
    - cron: '0 22 * * *'   # 00:00 Praha
    - cron: '0 6 * * *'    # 08:00 Praha
    - cron: '0 14 * * *'   # 16:00 Praha

jobs:
  smoke:
    name: Smoke E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        id: smoke_tests
        run: npx playwright test tests/e2e/01-registration.spec.ts tests/e2e/02-login.spec.ts
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_INTERNAL_FUNCTION_TOKEN: ${{ secrets.VITE_INTERNAL_FUNCTION_TOKEN }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Smoke status — OK
        if: success()
        run: |
          echo "## ✅ OneMil PROD smoke OK" >> $GITHUB_STEP_SUMMARY
          echo "registration + login passed" >> $GITHUB_STEP_SUMMARY

      - name: Telegram — OK
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"✅ OneMil PROD smoke OK — registration + login passed"}'

      - name: Smoke status — FAILED
        if: failure()
        run: |
          echo "## ❌ OneMil PROD smoke FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Check the HTML report artifact and screenshots above." >> $GITHUB_STEP_SUMMARY

      - name: Telegram — FAILED
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"❌ OneMil PROD smoke FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: test-results/
          retention-days: 7
