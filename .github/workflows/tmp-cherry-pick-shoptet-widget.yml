name: tmp-cherry-pick-shoptet-widget

on:
  push:
    branches:
      - fix/partner-shoptet-widget-snippet
    paths:
      - .github/workflows/tmp-cherry-pick-shoptet-widget.yml

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-shoptet-widget-snippet
          fetch-depth: 0

      - name: Cherry-pick approved widget snippet change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git cherry-pick c7720282ea18c8945515fec86939a879c19aaa0e
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            unmerged=$(git diff --name-only --diff-filter=U | sort)
            expected=$(printf "onemil_history.md\nonemil_state.md")
            if [ "$unmerged" != "$expected" ]; then
              echo "Unexpected conflicts:" >&2
              printf '%s\n' "$unmerged" >&2
              exit 1
            fi
            git checkout --ours onemil_history.md onemil_state.md
            python - <<'PY'
          from pathlib import Path
          import subprocess

          commit = 'c7720282ea18c8945515fec86939a879c19aaa0e'
          parent = 'e6914180fc4384225d148ccb597fa62283122b29'

          parent_history = subprocess.check_output(['git', 'show', f'{parent}:onemil_history.md'], text=True)
          target_history = subprocess.check_output(['git', 'show', f'{commit}:onemil_history.md'], text=True)
          if not target_history.endswith(parent_history):
              raise SystemExit('Unexpected onemil_history shape in source commit')
          new_history_block = target_history[:-len(parent_history)]
          history_path = Path('onemil_history.md')
          current_history = history_path.read_text(encoding='utf-8')
          marker = '# 17. 08. 2026 — Partner si zkopíruje kód widgetu přímo z dashboardu'
          if marker not in current_history:
              history_path.write_text(new_history_block + current_history, encoding='utf-8')

          target_state = subprocess.check_output(['git', 'show', f'{commit}:onemil_state.md'], text=True)
          start = target_state.index('## 0a1. Snippet widgetu v partnerském dashboardu')
          end = target_state.index('\n## 0. MioCoin', start)
          new_state_block = target_state[start:end].rstrip() + '\n\n---\n\n'
          state_path = Path('onemil_state.md')
          current_state = state_path.read_text(encoding='utf-8')
          if '## 0a1. Snippet widgetu v partnerském dashboardu' not in current_state:
              lines = current_state.splitlines(keepends=True)
              insert_at = 3 if len(lines) >= 3 else len(lines)
              state_path.write_text(''.join(lines[:insert_at]) + '\n' + new_state_block + ''.join(lines[insert_at:]), encoding='utf-8')
          PY
            git add onemil_history.md onemil_state.md
            git cherry-pick --continue
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test widget snippet
        run: npx playwright test tests/e2e/132-partner-shoptet-widget-snippet.spec.ts --project=chromium

      - name: Build
        run: npm run build

      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/tmp-cherry-pick-shoptet-widget.yml
          git add .github/workflows/tmp-cherry-pick-shoptet-widget.yml
          git commit -m "chore: remove temporary cherry-pick workflow"
          git push origin HEAD:fix/partner-shoptet-widget-snippet
