name: Temporary Sales Lead Response Validation

on:
  push:
    branches:
      - chatgpt/sales-lead-response-buttons

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run response contract
        run: npx playwright test tests/e2e/104-sales-lead-response-buttons.spec.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
